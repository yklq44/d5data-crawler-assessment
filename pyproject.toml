[project]
name = "mit-blogs-crawler"
version = "1.0.0"
description = "Crawl the MIT Admissions blogs with Playwright and DrissionPage and export every post to CSV."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # curly quotes and ellipses are part of the scraped text
    "SIM905",  # 'a b c'.split() keeps the HTML tag tables compact
]

[tool.ruff.format]
quote-style = "single"
