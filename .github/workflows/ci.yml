name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pages:
        description: Listing pages to crawl with both tools ("1", "3", "10-12", ...)
        default: '1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  crawl:
    name: Crawl with both tools and compare
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    env:
      PAGES: ${{ inputs.pages }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python crawl_playwright.py --pages "$PAGES"
      - run: python crawl_drissionpage.py --pages "$PAGES"
      - run: python compare.py output/mit_blogs_playwright.csv output/mit_blogs_drissionpage.csv
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crawl-output
          path: output/
          retention-days: 7
